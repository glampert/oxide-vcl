name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: rustfmt and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings

  test:
    name: build and test (${{ matrix.profile }})
    runs-on: ubuntu-latest
    # The corpus test takes about 15 minutes in debug on a fast machine.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: debug
            flag: ""
          - profile: release
            flag: --release
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.profile }}
      - name: Build
        run: cargo build --locked --all-targets ${{ matrix.flag }}
      # Tests that need the unpublished local data (local/evidence, the
      # optional local/corpus manifest) are ignored or skip themselves here.
      - name: Test
        run: cargo test --locked ${{ matrix.flag }}
