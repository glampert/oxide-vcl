[workspace]
resolver = "3"
members = ["crates/vcl", "crates/oxide-vcl", "crates/vusl", "crates/oxide-vusl"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
vcl = { path = "crates/vcl" }
vusl = { path = "crates/vusl" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release]
overflow-checks = true
